name: Fantasy Breakout Alerts

on:
  schedule:
    # Every 5 minutes (GitHub Actions' practical floor -- it doesn't reliably
    # honor anything tighter than 5 min regardless of cron syntax), only
    # during hours UTC 16:00-05:59 -- roughly noon to 1am Eastern (covers
    # both EST and EDT), the outer bound of when NFL or NBA games are ever
    # actually being played. Combined with the schedule-aware skip in
    # main.py (see daily_schedule.yml), this keeps the bot from burning
    # Actions minutes at 4am in July when nothing's happening.
    - cron: "*/5 16-23,0-5 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a test Telegram message instead of the real check'
        type: boolean
        default: false

permissions:
  contents: write  # needed so the workflow can commit the updated alerted.json

concurrency:
  # At a 5-minute interval, a slow run (a retried Sleeper URL fallback, a
  # sluggish Yahoo call) could still be running when the next one triggers.
  # This makes GitHub queue runs instead of letting them overlap and race
  # on the same state files / git push.
  group: fantasy-alerts-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      YAHOO_OAUTH_JSON: ${{ secrets.YAHOO_OAUTH_JSON }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Yahoo OAuth file
        if: ${{ env.YAHOO_OAUTH_JSON != '' }}
        run: echo "$YAHOO_OAUTH_JSON" > oauth2.json

      - name: Run breakout check
        if: ${{ github.event.inputs.send_test != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YAHOO_NFL_LEAGUE_KEY: ${{ secrets.YAHOO_NFL_LEAGUE_KEY }}
          YAHOO_NFL_TEAM_KEY: ${{ secrets.YAHOO_NFL_TEAM_KEY }}
          YAHOO_NBA_LEAGUE_KEY: ${{ secrets.YAHOO_NBA_LEAGUE_KEY }}
          YAHOO_NBA_TEAM_KEY: ${{ secrets.YAHOO_NBA_TEAM_KEY }}
        run: python main.py

      - name: Send test Telegram message
        if: ${{ github.event.inputs.send_test == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python test_telegram.py

      - name: Persist alert state so we don't re-alert the same breakout
        run: |
          git config user.name "fantasy-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alerted.json pending.json telegram_offset.json dashboard_history.json docs/data.json players_nfl_cache.json players_nba_cache.json || true
          git diff --cached --quiet || git commit -m "Update alert state [skip ci]"
          git push || true
