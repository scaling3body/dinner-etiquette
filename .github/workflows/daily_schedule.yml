name: Daily Game Schedule Check

on:
  schedule:
    # ~3am Eastern. GitHub Actions cron is UTC and doesn't shift for DST, so
    # this lands around 3am ET in winter (EST, UTC-5) and 4am ET in summer
    # (EDT, UTC-4). That's fine for a "figure out today's game days" check --
    # being an hour off doesn't matter here.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      force_nfl_active:
        description: 'Force NFL to be treated as active today (e.g. a weather-rescheduled game the day-of-week heuristic would miss)'
        type: boolean
        default: false
      force_nba_active:
        description: 'Force NBA to be treated as active today'
        type: boolean
        default: false

permissions:
  contents: write  # needed so the workflow can commit schedule_windows.json

concurrency:
  group: fantasy-alerts-check
  cancel-in-progress: false

jobs:
  check_schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine today's active sports
        env:
          FORCE_NFL_ACTIVE: ${{ github.event.inputs.force_nfl_active }}
          FORCE_NBA_ACTIVE: ${{ github.event.inputs.force_nba_active }}
        run: python game_schedule_checker.py

      - name: Persist schedule state
        run: python .github/scripts/persist_state.py schedule
