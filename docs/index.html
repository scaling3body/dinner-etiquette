<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fantasy Breakout Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; max-width: 640px;
         margin: 0 auto; padding: 20px; background: #0f1115; color: #e8e8e8; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; color: #9aa4b2; }
  .updated { color: #6b7280; font-size: 0.85rem; margin-bottom: 1.5rem; }
  .card { background: #1a1d24; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
  .card .msg { white-space: pre-line; }
  .card .time { color: #6b7280; font-size: 0.8rem; margin-top: 4px; }
  .pending .code { color: #f4b942; font-weight: 600; }
  .empty { color: #6b7280; font-style: italic; }
  .health-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .health-card { background: #1a1d24; border-radius: 10px; padding: 12px 16px; }
  .health-card .name { font-size: 0.85rem; color: #9aa4b2; margin-bottom: 4px; }
  .health-card .status { font-weight: 600; }
  .status.ok { color: #4ade80; }
  .status.warn { color: #f4b942; }
  .status.down { color: #f87171; }
  .health-card .detail { color: #6b7280; font-size: 0.78rem; margin-top: 3px; }
.stale { border: 1px solid #f4b942; }
</style>
</head>
<body>
  <h1>Fantasy Breakout Dashboard</h1>
  <div class="updated" id="updated">Loading...</div>

  <div id="check-status" class="card">Loading check status…</div>
  <h2>System Health</h2>
  <div class="health-grid" id="health"></div>

  <h2>Delivery Status</h2><div id="delivery"></div>
  <h2>Games Monitored</h2><div id="games"></div>
  <h2>Pending Add Suggestions</h2>
  <div id="pending"></div>

  <h2>Recent Breakouts</h2>
  <div id="alerts"></div>

<script src="dashboard.js"></script>
</body>
</html>
